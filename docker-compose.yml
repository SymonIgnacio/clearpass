version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: barangay_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: barangay_management
      MYSQL_USER: barangay_user
      MYSQL_PASSWORD: barangay_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - barangay_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # AI Service
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: barangay_ai
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - FLASK_APP=smart_suggestions.py
    ports:
      - "5000:5000"
    networks:
      - barangay_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: barangay_server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=barangay_user
      - DB_PASSWORD=barangay_pass
      - DB_NAME=barangay_management
      - DB_PORT=3306
      - SERVER_PORT=3001
      - CLIENT_URL=http://client:80
      - AI_SERVICE_URL=http://ai_service:5000
      - JWT_SECRET=your-super-secure-jwt-secret-key-change-in-production
    ports:
      - "3001:3001"
    networks:
      - barangay_network
    depends_on:
      db:
        condition: service_healthy
      ai_service:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/logs:/app/logs

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: barangay_client
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - barangay_network
    depends_on:
      - server

volumes:
  db_data:
    driver: local

networks:
  barangay_network:
    driver: bridge
