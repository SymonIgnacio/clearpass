version: '3.8'

services:
  app:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database configuration (update these with your actual values)
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=password
      - DB_NAME=clearpass
      - DB_PORT=3306
      # Firebase configuration
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-dummy_key}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-dummy.firebaseapp.com}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-dummy_project}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-dummy.appspot.com}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-123456789}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-1:123456789:web:abcdef123456}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-G-ABCDEFGHIJ}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - clearpass-network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=clearpass
      - MYSQL_USER=clearpass
      - MYSQL_PASSWORD=password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - clearpass-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:

networks:
  clearpass-network:
    driver: bridge
